server:
    username: "unbound"
    chroot: ""
    directory: "/etc/unbound"
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    num-threads: 1
    msg-cache-size: 16m
    rrset-cache-size: 32m
    outgoing-range: 256
    num-queries-per-thread: 128
    # Finite DNSBomb reply age bound, reviewed for the private single-client phase.
    # Ubuntu's 1900ms default can discard a cold DNSSEC result before validation ends.
    discard-timeout: 15000
    incoming-num-tcp: 32
    outgoing-num-tcp: 16
    edns-buffer-size: 1232
    max-udp-size: 1232
    minimal-responses: yes
    deny-any: yes
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    val-permissive-mode: no
    module-config: "validator iterator"
    root-hints: "/usr/share/dns/root.hints"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 127.0.0.0/8
    private-address: 169.254.0.0/16
    private-address: 100.64.0.0/10
    private-address: ::1/128
    private-address: fc00::/7
    private-address: fe80::/10
    access-control: 0.0.0.0/0 refuse
    access-control: ::/0 refuse
    access-control: 127.0.0.0/8 refuse
    access-control: 127.0.0.1/32 allow
    access-control: ::1/128 allow
    ip-ratelimit-factor: 0
    ratelimit: 100
    verbosity: 0
    log-queries: no
    log-replies: no
    extended-statistics: yes
    statistics-cumulative: yes
remote-control:
    control-enable: yes
    control-interface: /run/unbound.ctl
    control-use-cert: no

server:
    interface: 100.95.65.20
    interface: 127.0.0.1
    do-ip6: no
    ip-ratelimit: 20
    access-control: 100.85.132.14/32 allow
    local-zone: "20.65.95.100.in-addr.arpa." static
    local-data: "20.65.95.100.in-addr.arpa. 3600 IN PTR dns.vynalthai.com."
